<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account — Code Quality Evaluator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=2.7">
</head>
<body class="auth-page">

  <div class="app">

    <!-- fake window titlebar -->
    <div class="titlebar" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 18px; border-bottom: 1px solid var(--border);">
      <div style="display: flex; align-items: center; gap: 8px;">
        <div class="dots"><span></span><span></span><span></span></div>
        <div class="titlebar-name" style="font-weight: 700; font-size: 13px;">code-quality-evaluator</div>
      </div>
      <div style="display: flex; align-items: center; gap: 12px;">
        <a class="auth-link" href="index.html" style="font-size: 12px; color: var(--teal); text-decoration: none;">← Back to Editor</a>
        <button class="theme-toggle" id="themeToggle" title="Toggle light/dark mode">☀️</button>
      </div>
    </div>

    <header class="auth-hero">
      <div class="eyebrow">// account access</div>
      <h1 id="authTitle">Sign in</h1>
      <p id="authSubtitle">Continue analysing code and keep your work in one place.</p>
    </header>

    <main class="auth-card">

      <div class="auth-tabs" id="authTabs" role="tablist" aria-label="Account access">
        <button class="tab active" type="button" role="tab" aria-selected="true" aria-controls="loginForm" data-form="login">Log in</button>
        <button class="tab" type="button" role="tab" aria-selected="false" aria-controls="signupForm" data-form="signup">Sign up</button>
        <button class="tab" type="button" role="tab" aria-selected="false" aria-controls="resetForm" data-form="reset">Reset Password</button>
      </div>

      <!-- LOGIN FORM -->
      <form id="loginForm" class="auth-form" aria-label="Log in">
        <label>Email Address</label>
        <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email" required>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: -6px;">
          <label style="margin-bottom: 0;">Password</label>
          <a href="#" id="forgotPasswordLink" style="font-size: 11px; color: var(--teal); text-decoration: none;">Forgot password?</a>
        </div>
        <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" required>

        <button type="submit" id="loginBtn">▶ Log In</button>
        <div class="auth-message" id="loginMessage"></div>
      </form>

      <!-- SIGNUP FORM -->
      <form id="signupForm" class="auth-form hidden" aria-label="Sign up">
        <label>Your Full Name</label>
        <input type="text" id="signupName" placeholder="Rubina Sultana" autocomplete="name" required>

        <label>Email Address</label>
        <input type="email" id="signupEmail" placeholder="you@example.com" autocomplete="email" required>

        <label>Create Password</label>
        <input type="password" id="signupPassword" placeholder="••••••••" autocomplete="new-password" required>

        <button type="submit" id="signupBtn">▶ Create Account</button>
        <div class="auth-message" id="signupMessage"></div>
      </form>

      <!-- RESET PASSWORD FORM -->
      <form id="resetForm" class="auth-form hidden" aria-label="Reset Password">
        <label>Account Email</label>
        <input type="email" id="resetEmail" placeholder="you@example.com" autocomplete="email" required>

        <label>New Password</label>
        <input type="password" id="resetPassword" placeholder="Choose a new password" autocomplete="new-password" required>

        <button type="submit" id="resetBtn">▶ Set New Password</button>
        <div class="auth-message" id="resetMessage"></div>
      </form>

    </main>

    <footer class="auth-footer">Code Quality Evaluator &bull; Secure Authentication</footer>

  </div>

  <script src="js/auth.js?v=2.7"></script>
</body>
</html>
