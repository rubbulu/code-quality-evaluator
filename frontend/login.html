<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Code Quality Evaluator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app">

    <!-- fake window titlebar -->
    <div class="titlebar">
      <div class="dots"><span></span><span></span><span></span></div>
      <div class="titlebar-name">code-quality-evaluator — auth</div>
      <button class="theme-toggle" id="themeToggle" title="Toggle light/dark mode">☀️</button>
    </div>

    <header class="hero">
      <div class="eyebrow">// sign in to save your analysis history</div>
      <h1 style="font-size: 32px;">Welcome Back</h1>
    </header>

    <div class="pane" style="max-width: 380px; margin: 0 auto;">

      <div class="tabstrip" id="authTabs">
        <button class="tab active" data-form="login">Log In</button>
        <button class="tab" data-form="signup">Sign Up</button>
      </div>

      <!-- LOGIN FORM -->
      <form id="loginForm" class="auth-form">
        <label>Email</label>
        <input type="email" id="loginEmail" placeholder="you@example.com" required>

        <label>Password</label>
        <input type="password" id="loginPassword" placeholder="••••••••" required>

        <button type="submit" id="loginBtn">▶ Log In</button>
        <div class="auth-message" id="loginMessage"></div>
      </form>

      <!-- SIGNUP FORM -->
      <form id="signupForm" class="auth-form hidden">
        <label>Name</label>
        <input type="text" id="signupName" placeholder="Your name" required>

        <label>Email</label>
        <input type="email" id="signupEmail" placeholder="you@example.com" required>

        <label>Password</label>
        <input type="password" id="signupPassword" placeholder="••••••••" required>

        <button type="submit" id="signupBtn">▶ Create Account</button>
        <div class="auth-message" id="signupMessage"></div>
      </form>

    </div>

    <div class="statusbar">
      <span>Auth</span>
      <span class="statusbar-sep">•</span>
      <span id="statusReady">Ready</span>
      <span class="statusbar-spacer"></span>
      <span>Code Quality Evaluator v0.1</span>
    </div>

  </div>

  <script src="js/auth.js"></script>
</body>
</html>
